name: Isolated cloud sync HTTP proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SYNC_URL: ${{ secrets.SYNC_PROOF_URL }}
      SYNC_KEY: ${{ secrets.SYNC_PROOF_PUBLISHABLE_KEY }}
      SYNC_EMAIL: ${{ secrets.SYNC_PROOF_EMAIL }}
      SYNC_PASSWORD: ${{ secrets.SYNC_PROOF_PASSWORD }}
      SYNC_COMPANY: ${{ secrets.SYNC_PROOF_COMPANY }}
      SYNC_DEVICE: ${{ secrets.SYNC_PROOF_DEVICE }}
    steps:
      - name: Verify real authentication and reject unapproved device
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, uuid
          names=['URL','KEY','EMAIL','PASSWORD','COMPANY','DEVICE']
          cfg={n:os.environ.get('SYNC_'+n,'') for n in names}
          if not all(cfg.values()):
              raise SystemExit('BLOCKED: missing isolated test configuration')
          if not cfg['URL'].startswith('https://'):
              raise SystemExit('HTTPS required')
          def post(path, body, token=None):
              headers={'apikey':cfg['KEY'],'Content-Type':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              req=urllib.request.Request(cfg['URL'].rstrip('/')+path,json.dumps(body).encode(),headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return res.status,json.load(res)
              except urllib.error.HTTPError as e:
                  return e.code,json.load(e)
          status,auth=post('/auth/v1/token?grant_type=password',{'email':cfg['EMAIL'],'password':cfg['PASSWORD']})
          assert status==200 and auth.get('access_token'), 'Authentication failed'
          token=auth['access_token']
          args={'p_company':cfg['COMPANY'],'p_device':str(uuid.uuid4()),'p_after':0,'p_limit':1}
          status,body=post('/rest/v1/rpc/v3_proof_pull',args,token)
          assert status==403 and body.get('code')=='42501' and body.get('message')=='SYNC_DEVICE_DENIED', 'Unknown device denial mismatch'
          print('PASS: real login and exact unknown-device denial')
          print('NOT TESTED: approved-device access; requires binding the actual authenticated session')
          PY

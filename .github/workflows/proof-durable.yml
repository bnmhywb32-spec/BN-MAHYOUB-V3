name: Isolated SQLite durable checks
on:
  push:
    branches: ['proof/**']
    paths: ['.github/workflows/proof-durable.yml', 'proofs/**']
permissions:
  contents: read
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set -eo pipefail
          curl -fsSL https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin 2.1.20
          curl -fsSL https://repo.maven.apache.org/maven2/org/xerial/sqlite-jdbc/3.49.1.0/sqlite-jdbc-3.49.1.0.jar -o /tmp/sqlite.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar -o /tmp/slf4j.jar
          kotlinc proofs/kotlin/Durable.kt -include-runtime -d /tmp/durable.jar
          java -cp /tmp/durable.jar:/tmp/sqlite.jar:/tmp/slf4j.jar DurableKt
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - working-directory: proofs/flutter
        run: |
          dart pub get
          dart run durable.dart

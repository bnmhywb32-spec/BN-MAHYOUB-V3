name: Isolated platform build smoke
on:
  push:
    branches: ['proof/**']
    paths: ['.github/workflows/proof-platforms.yml']
permissions:
  contents: read
jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: web
          - os: ubuntu-24.04
            target: apk
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter create --project-name platform_proof --platforms=android,web,windows platform_proof
      - shell: bash
        run: |
          cat > platform_proof/lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          void main() => runApp(const MaterialApp(home: Scaffold(body: Center(child: Text('BN V3 platform smoke')))));
          EOF
      - working-directory: platform_proof
        run: flutter build ${{ matrix.target }}
  compose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            task: wasmJsBrowserDistribution
          - os: ubuntu-24.04
            task: assembleDebug
          - os: windows-2022
            task: packageDistributionForCurrentOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - shell: bash
        run: |
          mkdir -p platform_proof/src/{commonMain,androidMain,desktopMain,wasmJsMain}/kotlin
          cd platform_proof
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "platform-proof"
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              kotlin("multiplatform") version "2.1.20"
              id("org.jetbrains.compose") version "1.8.0"
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20"
              id("com.android.application") version "8.7.3"
          }
          kotlin {
              androidTarget()
              jvm("desktop")
              @OptIn(org.jetbrains.kotlin.gradle.ExperimentalWasmDsl::class)
              wasmJs { browser(); binaries.executable() }
              sourceSets {
                  commonMain.dependencies { implementation(compose.runtime); implementation(compose.foundation); implementation(compose.material) }
                  androidMain.dependencies { implementation("androidx.activity:activity-compose:1.10.1") }
                  val desktopMain by getting { dependencies { implementation(compose.desktop.currentOs) } }
              }
          }
          android { namespace = "proof.platform"; compileSdk = 35
              defaultConfig { applicationId = "proof.platform"; minSdk = 23; targetSdk = 35; versionCode = 1; versionName = "1" }
          }
          compose.desktop { application { mainClass = "MainKt"; nativeDistributions { targetFormats(org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi); packageName = "PlatformProof"; packageVersion = "1.0.0" } } }
          EOF
          cat > src/commonMain/kotlin/App.kt <<'EOF'
          import androidx.compose.runtime.Composable
          import androidx.compose.material.Text
          @Composable fun App() { Text("BN V3 platform smoke") }
          EOF
          cat > src/androidMain/kotlin/MainActivity.kt <<'EOF'
          package proof.platform
          import App
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          class MainActivity : ComponentActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { App() } } }
          EOF
          cat > src/androidMain/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Platform Proof"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > src/desktopMain/kotlin/Main.kt <<'EOF'
          import androidx.compose.ui.window.Window
          import androidx.compose.ui.window.application
          fun main() = application { Window(onCloseRequest = ::exitApplication) { App() } }
          EOF
          cat > src/wasmJsMain/kotlin/Main.kt <<'EOF'
          import androidx.compose.ui.ExperimentalComposeUiApi
          import androidx.compose.ui.window.ComposeViewport
          import kotlinx.browser.document
          @OptIn(ExperimentalComposeUiApi::class)
          fun main() { ComposeViewport(document.body!!) { App() } }
          EOF
          mkdir -p src/wasmJsMain/resources
          echo '<html><body><script src="platform-proof.js"></script></body></html>' > src/wasmJsMain/resources/index.html
          echo 'android.useAndroidX=true' > gradle.properties
      - working-directory: platform_proof
        run: gradle ${{ matrix.task }} --no-daemon --stacktrace

name: Platform SQLite runtime
on:
  push:
    branches: ['proof/**']
    paths:
      - 'proofs/platform-runtime/**'
      - '.github/workflows/proof-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    if: startsWith(github.ref, 'refs/heads/proof/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: web
          - os: ubuntu-24.04
            target: android
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
      - run: |
          flutter config --no-analytics
          flutter create --project-name platform_proof --platforms=android,web,windows runtime_app
          cp proofs/platform-runtime/flutter_main.dart runtime_app/lib/main.dart
          cp proofs/platform-runtime/proof_status*.dart runtime_app/lib/
          cp -r proofs/platform-runtime/integration_test runtime_app
          cd runtime_app
          flutter pub add 'sqflite:2.4.1' 'sqflite_common:2.5.5' 'sqflite_common_ffi:2.3.4+4' 'sqflite_common_ffi_web:0.4.5+4' 'dev:integration_test:{"sdk":"flutter"}'
          flutter analyze lib integration_test
      - if: matrix.target == 'windows'
        working-directory: runtime_app
        shell: pwsh
        run: ../proofs/platform-runtime/flutter_windows.ps1
      - if: matrix.target == 'android'
        name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-proof-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: matrix.target == 'android'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash proofs/platform-runtime/flutter_android.sh "$GITHUB_WORKSPACE/runtime_app"
      - if: matrix.target == 'web'
        working-directory: runtime_app
        run: |
          dart run sqflite_common_ffi_web:setup
          flutter build web
          python3 -m pip install --disable-pip-version-check playwright==1.52.0
          python3 ../proofs/platform-runtime/web_reload.py build/web --lock-name bn-v3-flutter-runtime-v1
  kotlin-windows:
    if: startsWith(github.ref, 'refs/heads/proof/')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run across JVM restarts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'kotlin-runtime')
          $base = 'https://dl.google.com/dl/android/maven2/androidx/sqlite'
          foreach ($module in @('sqlite-jvm', 'sqlite-bundled-jvm')) {
            Invoke-WebRequest "$base/$module/2.5.0/$module-2.5.0.jar" -OutFile (Join-Path $work "$module.jar")
          }
          $archive = Join-Path $work 'compiler.zip'
          Invoke-WebRequest 'https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip' -OutFile $archive
          Expand-Archive $archive $work
          $lib = Join-Path $work 'kotlinc/lib'
          $stdlib = Join-Path $lib 'kotlin-stdlib.jar'
          $dependencies = @((Join-Path $work 'sqlite-jvm.jar'), (Join-Path $work 'sqlite-bundled-jvm.jar')) -join ';'
          $jar = Join-Path $work 'proof.jar'
          java -cp "$lib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -no-stdlib -no-reflect -classpath "$stdlib;$dependencies" -d $jar proofs/platform-runtime/Runtime.kt proofs/platform-runtime/NativeDriver.kt proofs/platform-runtime/JvmMain.kt
          $database = Join-Path $work 'runtime.db'
          java -cp "$jar;$stdlib;$dependencies" JvmMainKt $database seed
          java -cp "$jar;$stdlib;$dependencies" JvmMainKt $database relaunch
  kotlin-android:
    if: startsWith(github.ref, 'refs/heads/proof/')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-proof-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash proofs/platform-runtime/kotlin_android.sh proofs/platform-runtime/android
  kotlin-web:
    if: startsWith(github.ref, 'refs/heads/proof/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          set -euo pipefail
          cd proofs/platform-runtime/web
          gradle browserDistribution --no-daemon --stacktrace
          runtime="$(find build -path '*/sql.js/dist/sql-wasm.wasm' -print -quit)"
          test -n "$runtime"
          cp "$runtime" build/dist/js/productionExecutable/
          python3 -m pip install --disable-pip-version-check playwright==1.52.0
          python3 ../web_reload.py build/dist/js/productionExecutable --lock-name bn-v3-kotlin-runtime-v1 --test-abort
